<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Diskotéka </title>
    <style>
        body { font-family: sans-serif; background-color: #1a1a1a; color: white; text-align: center; padding-top: 50px; }
        .box { background: #333; padding: 20px; border-radius: 10px; display: inline-block; }
        input { display: block; margin: 10px auto; padding: 8px; border-radius: 5px; border: none; }
        button { background: #28a745; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #218838; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Přihlášení na diskotéku </h2>
        <input type="text" id="jmeno" placeholder="Tvoje jméno">
        <input type="password" id="heslo" placeholder="Tvoje heslo">
        <button onclick="prihlasit()">Vstoupit</button>
    </div>
    <script>
        function prihlasit() {
            var zadaneJmeno = document.getElementById("jmeno").value;
            var zadaneHeslo = document.getElementById("heslo").value;
            var seznamUzivatelu = {
                "kubikpob": "121024",
                "Novys": "hesloheslo"
            };
            if (seznamUzivatelu[zadaneJmeno] !== undefined && seznamUzivatelu[zadaneJmeno] === zadaneHeslo) {
                alert("Vítej, " + zadaneJmeno + "! tady najdeš playlist na dikotéku.");
                window.location.href = "hry.html";
            } else {
                alert("Špatné jméno nebo heslo! Zkus to znovu.");
            }
        }
    </script>
</body>
</html>
